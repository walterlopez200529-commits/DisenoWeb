<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="formulario">
        <h2>Tienda Online</h2>

        <div class="campos">
            <label for="producto">Producto:</label>
            <select id="producto">
                <option value="">-- Selecciona un producto --</option>
                <option value="Laptop" data-precio="2500">Laptop - S/ 2500.00</option>
                <option value="Mouse" data-precio="45">Mouse - S/ 45.00</option>
                <option value="Teclado" data-precio="80">Teclado - S/ 80.00</option>
                <option value="Monitor" data-precio="850">Monitor - S/ 850.00</option>
                <option value="Audífonos" data-precio="120">Audífonos - S/ 120.00</option>
            </select>
        </div>

        <div class="campos">
            <label for="precio">Precio (S/):</label>
            <input type="number" id="precio" placeholder="0.00" readonly>
        </div>

        <div class="campos">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1" value="1">
        </div>

        <div class="botones">
            <input type="button" id="agregarBtn" value="Agregar">
            <input type="button" id="eliminarBtn" value="Eliminar">
            <input type="button" id="limpiarBtn" value="Vaciar Carrito">
        </div>
    </div>

    <div class="contactos">
        <h2>Carrito de Compras</h2>
        <table class="tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio Unit.</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="listaCarrito"></tbody>
        </table>
        <div class="total-box">
            <strong>TOTAL: S/ <span id="totalCompra">0.00</span></strong>
        </div>
    </div>

    <script src="js/carrito.js"></script>
</body>
</html>
