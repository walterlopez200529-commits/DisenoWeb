<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agenda V3</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="formulario">
        <h2>Agregar Contacto</h2>
        <form id="formulario">
            <div class="campos">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">
            </div>
            <div class="campos">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono">
            </div>
            <div class="campos">
                <label for="email">email:</label>
                <input type="email" id="email">
            </div>
            <div class="campos">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion">
            </div>
            <div class="botones">
                <input type="button" id="guardarBtn" value="Guardar">
                <input type="button" id="buscarBtn" value="Buscar">
                <input type="button" id="eliminarBtn" value="Eliminar">
                <input type="button" id="eliminarTodosBtn" value="Eliminar Todos">
                <input type="button" id="contarBtn" value="Contar">
            </div>
            <br>
        </form>
    </div>

    <div class="contactos">
        <h2>Lista de Contactos</h2>
        <table class="tabla-contactos">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Celular</th>
                    <th>email</th>
                    <th>Dirección</th>
                </tr>
            </thead>
            <tbody id="listaContactos"></tbody>
        </table>
    </div>

    <script src="js/agendaV3.js"></script>
</body>

</html>
