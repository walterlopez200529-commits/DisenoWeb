<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pacman - Diseño Web</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="contenedor-juego">
        <h1>PACMAN</h1>

        <div class="info-juego">
            <div class="puntaje">
                <span>Puntaje:</span>
                <span id="puntaje">0</span>
            </div>
            <div class="vidas">
                <span>Vidas:</span>
                <span id="vidas">❤️❤️❤️</span>
            </div>
        </div>

        <div id="tablero" class="tablero"></div>

        <div id="mensaje" class="mensaje oculto"></div>

        <div class="controles">
            <button id="btnIniciar" class="boton-control">Iniciar Juego</button>
            <p class="instrucciones">Usa las flechas del teclado ⬆️ ⬇️ ⬅️ ➡️ para mover a Pacman</p>
        </div>
    </div>

    <script src="js/pacman.js"></script>
</body>
</html>
