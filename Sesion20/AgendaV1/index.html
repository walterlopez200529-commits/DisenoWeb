<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/agendaV1.css">
    <title>Agenda V1</title>
</head>
<body>
    <div class="formulario">
        <h2>Agregar Contacto</h2>
        <form id="formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono">
            <input type="button" value="Guardar datos" id="guardarBtn">
        </form>
    </div>

    <div class="contactos">
        <h2>Lista de contactos</h2>
        <ul id="lista">

        </ul>
        <input type="button" value="Recuperar datos" id="recuperarBtn">
    </div>
    <script src="js/agendaV1.js"></script>
</body>
</html>
