<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registro de Usuario</title>
</head>

<body>

    <div id="Contenedor" style="width: 700px; display: flex; border: 1px solid #999;">

        <div id="panelIzquierdo" style="width: 220px; background-color: #cccccc; padding: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <h2>Bienvenido</h2>
            <p>Para unirte a nuestra comunidad por favor inicia sesión con tus datos</p>
            <input type="button" value="Iniciar sesión" style="padding: 6px 14px; font-weight: bold;">
        </div>

        <div id="panelDerecho" style="flex: 1; padding: 30px; text-align: center;">
            <h2>Nuevo Usuario</h2>

            <input type="button" value="Registro con Facebook">
            <input type="button" value="Registro con google">
            <br><br>
            <p>O registrarse con</p>

            <form id="formulario1" name="formulario1" method="post" action="data.php">

                <input type="text" name="nombres" id="nombres" placeholder="Nombres" style="width: 178px;">
                <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos" style="width: 178px;">
                <br><br>

                <input type="email" name="correo" id="correo" placeholder="micorreo@dominio" style="width: 370px;"><br><br>

                <input type="password" name="contrasena" id="contrasena" placeholder="su contrasena" style="width: 370px;"><br>

                <br>
                <input type="checkbox" name="terminos" id="terminos">
                <label for="terminos">Al crear esta cuenta, aceptas nuestros <b>terminos &amp; condiciones</b></label>
                <br><br>

                <input type="submit" value="Enviar">

            </form>
        </div>

    </div>

</body>
